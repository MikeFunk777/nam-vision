name: Release Native

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: NeuralAmpModeler
  INSTALLER_DISPLAY_NAME: NAM Division
  INSTALLER_APP_CONTACT: https://github.com/kylewetton/nam-division/issues
  INSTALLER_APP_COPYRIGHT: Copyright (C) 2026 Pedal Division
  INSTALLER_APP_PUBLISHER: Pedal Division
  INSTALLER_APP_PUBLISHER_URL: https://pedaldivision.com
  INSTALLER_APP_SUPPORT_URL: https://github.com/kylewetton/nam-division/issues
  INSTALLER_OUTPUT_BASE_FILENAME: NAM Division Installer
  INSTALLER_SCRIPT_NAME: NeuralAmpModeler.iss

jobs:
  verify_version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Match tag to plug-in version
        shell: bash
        run: |
          version=$(sed -n 's/^#define PLUG_VERSION_STR "\([^"]*\)"/\1/p' "$PROJECT_NAME/config.h")
          stable_tag="v$version"
          beta_tag="${stable_tag}b"
          if [[ "$GITHUB_REF_NAME" != "$stable_tag" && "$GITHUB_REF_NAME" != "$beta_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME must be $stable_tag or $beta_tag" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: verify_version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-15-intel
            artifact_name: release-macos
            artifact_path: NeuralAmpModeler/build-mac/out/*.dmg
          - label: Windows
            os: windows-2022
            artifact_name: release-windows
            artifact_path: |
              NeuralAmpModeler/build-win/out/*.zip
              !NeuralAmpModeler/build-win/out/*-pdbs.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get VST3 SDK
        shell: bash
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-iplug-sdks.sh

      - name: Get prebuilt libraries
        shell: bash
        run: |
          cd iPlug2/Dependencies
          ./download-prebuilt-libs.sh

      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$PROJECT_NAME/scripts"
          ./makedist-mac.sh full installer

      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "$env:PROJECT_NAME\scripts"
          & .\makedist-win.bat full installer
          $namBuildExitCode = $LASTEXITCODE
          if ($namBuildExitCode -ne 0) {
            $namLog = Join-Path .. "build-win.log"
            if (Test-Path $namLog) {
              Get-Content $namLog |
                Select-String -Pattern '\berror (C|LNK|MSB)\d+' |
                Select-Object -Last 20 |
                ForEach-Object {
                  $namMessage = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Output "::error::$namMessage"
                }
            }
            exit $namBuildExitCode
          }

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  create_draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release candidates
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List release assets
        run: find dist -maxdepth 1 -type f -print

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *b ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --generate-notes \
            --title "NAM Division $GITHUB_REF_NAME" \
            "${prerelease_args[@]}" \
            --verify-tag
