name: Build Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 8 * * 2"

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: NeuralAmpModeler

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-15-intel
            build_dir: build-mac
            artifact_ext: mac
          - label: Windows
            os: windows-2022
            build_dir: build-win
            artifact_ext: win

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get VST3 SDK
        shell: bash
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-iplug-sdks.sh

      - name: Get prebuilt libraries
        shell: bash
        run: |
          cd iPlug2/Dependencies
          ./download-prebuilt-libs.sh

      - name: Build macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$PROJECT_NAME/scripts"
          ./makedist-mac.sh full zip

      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "$env:PROJECT_NAME\scripts"
          & .\makedist-win.bat full zip
          $namBuildExitCode = $LASTEXITCODE
          if ($namBuildExitCode -ne 0) {
            $namLog = Join-Path .. "build-win.log"
            if (Test-Path $namLog) {
              Get-Content $namLog |
                Select-String -Pattern '\berror (C|LNK|MSB)\d+' |
                Select-Object -Last 20 |
                ForEach-Object {
                  $namMessage = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Output "::error::$namMessage"
                }
            }
            exit $namBuildExitCode
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.artifact_ext }}
          path: ${{ env.PROJECT_NAME }}/${{ matrix.build_dir }}/out
          if-no-files-found: error
